name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    # The "latest" harness follows new Home Assistant releases and only warns.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: HA 2026.5.0 (minimum)
            harness: "pytest-homeassistant-custom-component==0.13.329"
            pymodbus: "pymodbus==3.11.2"
            experimental: false
          - name: HA 2026.10.4
            harness: "pytest-homeassistant-custom-component==0.13.375"
            pymodbus: "pymodbus==3.13.1"
            experimental: false
          - name: latest harness
            harness: "pytest-homeassistant-custom-component"
            pymodbus: "pymodbus"
            experimental: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install test dependencies
        run: python -m pip install "${{ matrix.harness }}" "${{ matrix.pymodbus }}" "mypy>=1.10"

      - name: Run tests
        run: pytest tests --rootdir=tests

      - name: Run mypy
        if: matrix.name == 'HA 2026.10.4'
        run: mypy --strict --ignore-missing-imports --explicit-package-bases custom_components/saj_as1_modbus tests

  hacs:
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Hassfest
        uses: home-assistant/actions/hassfest@master
