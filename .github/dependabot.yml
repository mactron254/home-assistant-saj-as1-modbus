version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python-dev-tools:
        patterns:
          - "pytest"
          - "mypy"
    ignore:
      # PyModbus is intentionally aligned with the Home Assistant version under test.
      - dependency-name: "pymodbus"
    labels:
      - "dependencies"
      - "security"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "actions/*"
          - "home-assistant/actions/*"
          - "hacs/action"
    labels:
      - "dependencies"
      - "security"
