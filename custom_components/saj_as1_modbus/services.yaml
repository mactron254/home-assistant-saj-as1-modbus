set_profile:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: saj_as1_modbus
    charge_power_pct:
      required: false
      example: 50
      selector:
        number:
          min: 1
          max: 100
          step: 1
          mode: box
          unit_of_measurement: "%"
    discharge_power_pct:
      required: false
      example: 50
      selector:
        number:
          min: 1
          max: 100
          step: 1
          mode: box
          unit_of_measurement: "%"
    user_mode:
      required: false
      example: "time_of_use"
      selector:
        select:
          translation_key: user_mode
          options:
            - "self_use"
            - "time_of_use"
            - "backup"
            - "manual"
